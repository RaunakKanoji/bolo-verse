name: shape-studio-local-storage

services:
  storage:
    image: chrislusf/seaweedfs:4.53
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=128
      - -master.telemetry=false
      - -volume.max=8
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/local-s3.json
      - -s3.iam=false
      - -s3.autoCreateBucket=false
      - -s3.allowedOrigins=http://127.0.0.1:3000,http://127.0.0.1:3180
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -webdav=false
      - -admin.ui=false
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - data:/data
      - ../../.local-storage/s3.json:/etc/seaweedfs/local-s3.json:ro
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/dir/status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  data:
    name: shape-studio-local-storage-data
