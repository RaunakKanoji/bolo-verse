                },
                "startSeconds": {
                  "type": "number",
                  "minimum": 0
                },
                "durationSeconds": {
                  "type": "number",
                  "exclusiveMinimum": 0,
                  "maximum": 600
                },
                "trimStartSeconds": {
                  "type": "number",
                  "minimum": 0
                },
                "audioLevel": {
                  "type": "number",
                  "minimum": 0,
                  "maximum": 2
                }
              },
              "required": [
                "id",
                "assetId",
                "startSeconds",
                "durationSeconds",
                "trimStartSeconds",
                "audioLevel"
              ],
              "additionalProperties": false
            }
          },
          "overlays": {
            "maxItems": 50,
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "format": "uuid",
                  "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                },
                "kind": {
                  "type": "string",
                  "enum": [
                    "title",
                    "caption"
                  ]
                },
                "text": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 500
                },
                "startSeconds": {
                  "type": "number",
                  "minimum": 0
                },
                "durationSeconds": {
                  "type": "number",
                  "exclusiveMinimum": 0,
                  "maximum": 600
                },
                "style": {
                  "type": "object",
                  "properties": {
                    "color": {
                      "type": "string",
                      "pattern": "^#[0-9a-fA-F]{6}$"
                    },
                    "fontSize": {
                      "type": "integer",
                      "minimum": 12,
                      "maximum": 120
                    },
                    "align": {
                      "type": "string",
                      "enum": [
                        "left",
                        "center",
                        "right"
                      ]
                    }
                  },
                  "required": [
                    "color",
                    "fontSize",
                    "align"
                  ],
                  "additionalProperties": false
                }
              },
              "required": [
                "id",
                "kind",
                "text",
                "startSeconds",
                "durationSeconds",
                "style"
              ],
              "additionalProperties": false
            }
          }
        },
        "required": [
          "schemaVersion",
          "aspectRatio",
          "clips",
          "overlays"
        ],
        "additionalProperties": false
      },
