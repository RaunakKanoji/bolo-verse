<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070d" />
  <title>BoloVerse</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Syne:wght@700&display=swap" />
  <link rel="stylesheet" href="./shared/theme.css" />
  <link rel="stylesheet" href="./app/app.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <span class="wordmark">BoloVerse</span>
      <span class="pill mono" id="modelStatus">Model: loading…</span>
    </header>

    <!-- 1. Product -->
    <section class="step">
      <p class="label">1 · Product</p>
      <label class="btn" for="photo">Add product photo</label>
      <input id="photo" type="file" accept="image/*" hidden />
      <div class="cutout checker" id="cutoutBox" hidden>
        <img id="cutoutImg" alt="Product cut-out" />
      </div>
      <p class="mono muted" id="cutoutStatus">Take a photo or pick one from the gallery.</p>
    </section>

    <!-- Preview -->
    <section class="step">
      <p class="label">Preview · 9:16</p>
      <div class="stage"><canvas id="preview" aria-label="Video preview"></canvas></div>
    </section>

    <!-- 2. Scene (manual controls; voice arrives in milestone B) -->
    <section class="step">
      <p class="label">2 · Scene</p>
      <div class="bgs" id="bgs" role="radiogroup" aria-label="Background"></div>

      <p class="label sub">Motion</p>
      <div class="chips" id="motions" role="radiogroup" aria-label="Motion"></div>

      <p class="label sub">Speed</p>
      <div class="chips" id="speeds" role="radiogroup" aria-label="Speed"></div>

      <label class="slider"><span class="label">Duration <b id="durationOut">8 s</b></span>
        <input id="duration" type="range" min="5" max="15" step="1" value="8" /></label>

      <details class="grade">
        <summary class="label">Colour grade</summary>
        <label class="slider"><span class="label">Temperature <b id="temperatureOut">0</b></span>
          <input id="temperature" type="range" min="-1" max="1" step="0.05" value="0" /></label>
        <label class="slider"><span class="label">Brightness <b id="brightnessOut">1</b></span>
          <input id="brightness" type="range" min="0.5" max="1.5" step="0.05" value="1" /></label>
        <label class="slider"><span class="label">Contrast <b id="contrastOut">1</b></span>
          <input id="contrast" type="range" min="0.8" max="1.3" step="0.05" value="1" /></label>
      </details>
    </section>

    <!-- 3. Record -->
    <section class="step">
      <p class="label">3 · Record</p>
      <label class="toggle"><input id="narrate" type="checkbox" /> <span>Narrate live with the mic while recording</span></label>
      <button class="btn" id="record" type="button" disabled>Record video</button>
      <div class="progress" id="progress" hidden><div id="progressBar"></div></div>
      <p class="mono muted" id="recordStatus">Add a product photo first.</p>

      <div class="result" id="result" hidden>
        <video id="video" controls playsinline></video>
        <a class="btn ghost" id="download" download="boloverse.webm">Download video</a>
        <div class="share" id="share" hidden>
          <canvas id="qr" aria-label="QR code to watch the video"></canvas>
          <p class="mono muted">Scan to watch on another phone (link valid 24 h).</p>
          <a class="mono" id="shareLink" target="_blank" rel="noopener">Open link</a>
        </div>
      </div>
    </section>

    <footer class="mono muted foot"><a href="/check/">System check</a> · <a href="/metrics/">Metrics</a></footer>
  </main>
  <script type="module" src="./app/main.js"></script>
</body>
</html>
